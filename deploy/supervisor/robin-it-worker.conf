; Queue worker for Robin IT.
;
; Order confirmation, status update and welcome mail are all queued. Checkout
; deliberately does not wait for mail — a slow SMTP server must never fail an
; order — which means that if no worker is running, customers simply stop
; receiving anything and nothing in the application complains. This process is
; what makes sure that does not happen.
;
; Install:
;   sudo cp deploy/supervisor/robin-it-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status robin-it-worker:*

[program:robin-it-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/robin-it

; --tries=3     a transient SMTP failure gets two more chances before failing
; --backoff=10  wait 10s between those attempts rather than hammering
; --max-time    recycle the process hourly; long-lived PHP leaks memory
; --sleep=3     poll interval when the queue is empty
command=php /var/www/robin-it/artisan queue:work --queue=default --tries=3 --backoff=10 --max-time=3600 --sleep=3

autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true

; One worker handles this store's volume comfortably. Raise it if the pending
; count in `php artisan queue:health` stays above zero for long.
numprocs=1

user=www-data

; Must exceed the longest job so a restart never kills mail mid-send.
stopwaitsecs=60

redirect_stderr=true
stdout_logfile=/var/www/robin-it/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
