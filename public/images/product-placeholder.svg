<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Soft Studio Lighting Gradient -->
    <radialGradient id="studioGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </radialGradient>

    <!-- Brand Crimson Gradients -->
    <linearGradient id="brandRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea484f"/>
      <stop offset="100%" stop-color="#b7191e"/>
    </linearGradient>

    <!-- Tech Slate Gradients -->
    <linearGradient id="caseDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="caseSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="rgbStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea484f"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Background -->
  <rect width="600" height="600" fill="url(#studioGlow)"/>

  <!-- Subtle Circular Ambient Accent -->
  <circle cx="300" cy="270" r="190" fill="#ea484f" fill-opacity="0.035"/>
  <circle cx="300" cy="270" r="130" fill="#38bdf8" fill-opacity="0.02"/>

  <!-- Geometric Tech Pattern Background Grid -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="6 6">
    <line x1="120" y1="270" x2="480" y2="270"/>
    <line x1="300" y1="120" x2="300" y2="420"/>
  </g>

  <!-- MAIN HARDWARE COMPOSITION (Monitor, Custom Tower Rig, GPU, Peripherals) -->
  <g filter="url(#softShadow)">
    
    <!-- 1. Ultra-Wide Curved Monitor -->
    <!-- Monitor Stand Base -->
    <path d="M190 365 L290 365 L300 375 L180 375 Z" fill="#94a3b8"/>
    <!-- Stand Pillar -->
    <path d="M232 290 L248 290 L245 365 L235 365 Z" fill="#64748b"/>
    
    <!-- Monitor Bezel Curved -->
    <rect x="90" y="150" width="300" height="175" rx="14" fill="url(#caseDark)" stroke="#475569" stroke-width="3"/>
    <!-- Monitor Display Screen -->
    <rect x="96" y="156" width="288" height="152" rx="8" fill="url(#screenGrad)"/>
    
    <!-- Screen Content: Code / Tech Visual with RGB Aura -->
    <path d="M120 230 Q 180 180, 240 210 T 360 190" fill="none" stroke="url(#rgbStripe)" stroke-width="3" opacity="0.85"/>
    <path d="M130 250 Q 200 200, 260 230 T 350 215" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Monitor Bottom Power LED -->
    <circle cx="240" cy="316" r="2.5" fill="#ea484f" filter="url(#glowFilter)"/>

    <!-- 2. Flagship Gaming PC Case Tower (Isometric Front-Right) -->
    <!-- Case Main Body Outer -->
    <g transform="translate(320, 130)">
      <!-- Main Chassis Front Panel -->
      <path d="M45 0 L150 0 L150 240 L45 240 Z" fill="url(#caseDark)" stroke="#334155" stroke-width="2"/>
      
      <!-- Tempered Glass Side Window -->
      <path d="M0 25 L45 0 L45 240 L0 215 Z" fill="url(#caseSide)"/>
      <path d="M2 30 L43 7 L43 235 L2 212 Z" fill="url(#glassReflection)"/>
      
      <!-- Internal RGB Components Visible Through Glass -->
      <!-- CPU Cooler AIO RGB Ring -->
      <circle cx="22" cy="90" r="14" fill="none" stroke="url(#brandRed)" stroke-width="3" filter="url(#glowFilter)"/>
      <circle cx="22" cy="90" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      
      <!-- RAM RGB Sticks -->
      <rect x="36" y="70" width="3" height="22" rx="1.5" fill="#38bdf8" filter="url(#glowFilter)"/>
      <rect x="40" y="70" width="3" height="22" rx="1.5" fill="#ea484f" filter="url(#glowFilter)"/>
      
      <!-- GPU Backplate / Side Logo -->
      <rect x="6" y="130" width="34" height="12" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
      <line x1="8" y1="136" x2="36" y2="136" stroke="url(#rgbStripe)" stroke-width="2"/>

      <!-- Front Mesh Air Intake Grill -->
      <g fill="#475569" opacity="0.6">
        <line x1="60" y1="40" x2="135" y2="40" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="60" x2="135" y2="60" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="80" x2="135" y2="80" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="100" x2="135" y2="100" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="120" x2="135" y2="120" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="140" x2="135" y2="140" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="160" x2="135" y2="160" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="180" x2="135" y2="180" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      </g>
      
      <!-- Front Panel Power Button & Ports -->
      <circle cx="98" cy="18" r="3.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="112" cy="18" r="1.5" fill="#ea484f"/>
      <circle cx="120" cy="18" r="1.5" fill="#38bdf8"/>

      <!-- Vertical RGB Ambient Accent Line -->
      <line x1="52" y1="25" x2="52" y2="225" stroke="url(#brandRed)" stroke-width="2.5" stroke-linecap="round" filter="url(#glowFilter)"/>
    </g>

    <!-- 3. Mechanical Keyboard & Mouse Peripheral Details -->
    <!-- Keyboard Base -->
    <path d="M120 380 L280 380 L290 405 L110 405 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <line x1="125" y1="392" x2="275" y2="392" stroke="url(#rgbStripe)" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Gaming Mouse -->
    <path d="M315 385 C315 378, 335 378, 335 385 L335 398 C335 404, 315 404, 315 398 Z" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <circle cx="325" cy="384" r="1.5" fill="#ea484f" filter="url(#glowFilter)"/>
  </g>

  <!-- GROUND SHADOW ELLIPSE -->
  <ellipse cx="300" cy="420" rx="220" ry="14" fill="#0f172a" fill-opacity="0.08"/>

  <!-- BRANDING WATERMARK / BADGE AT BOTTOM -->
  <g transform="translate(300, 485)">
    <!-- Pill Badge Container -->
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
    
    <!-- Robins Mini Brand Icon (Monitor + Arrow) -->
    <rect x="-122" y="-10" width="20" height="15" rx="3" fill="url(#brandRed)"/>
    <line x1="-112" y1="5" x2="-112" y2="9" stroke="#b7191e" stroke-width="2"/>
    <path d="M-117 9 L-107 9" stroke="#b7191e" stroke-width="2"/>
    
    <!-- Robins Computer Brand Text -->
    <text x="-92" y="5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0f172a" letter-spacing="0.5">ROBINS COMPUTER</text>
    
    <!-- Divider -->
    <circle cx="48" cy="0" r="2" fill="#cbd5e1"/>
    
    <!-- Official Hardware Text -->
    <text x="60" y="4.5" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#ea484f" letter-spacing="0.3">GENUINE IT</text>
  </g>

  <!-- Secondary Hint Text -->
  <text x="300" y="540" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.4">Authorized Technology &amp; Computer Components</text>
</svg>
