name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Fast feedback on every push. SQLite in memory, no services to spin up.
  sqlite:
    name: PHPUnit (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - run: php vendor/bin/phpunit --no-coverage

  # The suite that matters: production runs MySQL, and the two drivers return
  # DECIMAL columns differently. A pricing bug once survived CI precisely because
  # only SQLite was exercised.
  mysql:
    name: PHPUnit (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: robin_it_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot --silent && break
            sleep 2
          done

      - run: php vendor/bin/phpunit -c phpunit.mysql.xml --no-coverage

  # Code style and a production asset build, so neither can rot unnoticed.
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP formatting
        run: php vendor/bin/pint --test

      - run: npm ci

      - name: Check JS/CSS formatting
        run: npx prettier --check "resources/js/**/*.{js,jsx,css}"

      - name: Build production assets
        run: npm run build
