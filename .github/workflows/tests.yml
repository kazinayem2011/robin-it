name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Fast feedback on every push. SQLite in memory, no services to spin up.
  sqlite:
    name: PHPUnit (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 8.4, not 8.3: composer.lock pins Symfony 8.1, which requires
      # php >=8.4.1. On 8.3 `composer install` stops at "Verifying lock file
      # contents" and every job fails before a single test runs. composer.json
      # still says ^8.3 — the lock is the stricter of the two.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - run: php vendor/bin/phpunit --no-coverage

  # The suite that matters: production runs MySQL, and the two drivers return
  # DECIMAL columns differently. A pricing bug once survived CI precisely because
  # only SQLite was exercised.
  mysql:
    name: PHPUnit (MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: robin_it_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot --silent && break
            sleep 2
          done

      - run: php vendor/bin/phpunit -c phpunit.mysql.xml --no-coverage

  # Code style and a production asset build, so neither can rot unnoticed.
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP formatting
        run: php vendor/bin/pint --test

      - run: npm ci

      - name: Check JS/CSS formatting
        run: npx prettier --check "resources/js/**/*.{js,jsx,css}"

      # Catches references to things that do not exist and hooks called
      # conditionally. Products/Show.jsx once rendered <ProductImage> without
      # importing it: the build succeeded, and every product detail page threw
      # at render and showed a blank screen. No PHP test can see that.
      - name: Lint JavaScript
        run: npm run lint

      # Every card, button, input, select and dropdown is meant to be rounded
      # 8px. A literal typed into any of the twenty-five stylesheets renders
      # slightly off and is only ever caught by eye — 6px, 10px and 9999px all
      # got in that way.
      - name: Check corner rounding
        run: npm run lint:radius

      # React component and hook behaviour. The admin search box once fired an
      # unbounded request loop — 280 requests in 6 seconds — which was likewise
      # invisible to the PHP suite.
      - name: Frontend tests
        run: npm test

      - name: Build production assets
        run: npm run build

      # A test file co-located under Pages was picked up by the Inertia page
      # glob and bundled — Vitest and Testing Library included — as the
      # largest asset on the site. Nothing else would have noticed.
      - name: No test code in the production bundle
        run: |
          if ls public/build/assets/ | grep -Ei '\.(test|spec)-'; then
            echo "Test files were bundled into the production build."
            exit 1
          fi
          echo "No test code in the bundle."

