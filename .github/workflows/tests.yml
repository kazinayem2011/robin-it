name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Fast feedback on every push. SQLite in memory, no services to spin up.
  sqlite:
    name: PHPUnit (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 8.4, not 8.3: composer.lock pins Symfony 8.1, which requires
      # php >=8.4.1. On 8.3 `composer install` stops at "Verifying lock file
      # contents" and every job fails before a single test runs. composer.json
      # says ^8.4 to match. Production is on 8.4 too.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - run: php vendor/bin/phpunit --no-coverage

  # The suite that matters: it runs on the database production runs, and that
  # and SQLite return DECIMAL columns differently. A pricing bug once survived
  # CI precisely because only SQLite was exercised.
  #
  # MariaDB 11.4, not MySQL. This job ran mysql:8.0 on the belief that
  # production did; a phpMyAdmin export of the live database says
  # "11.4.x-MariaDB". The two share a wire protocol and Laravel's mysql
  # driver, but not every function, JSON behaviour or default — testing on one
  # and running on the other leaves exactly that gap unchecked.
  mysql:
    name: PHPUnit (MariaDB)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: robin_it_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot --silent && break
            sleep 2
          done

      - run: php vendor/bin/phpunit -c phpunit.mysql.xml --no-coverage

  # Code style and a production asset build, so neither can rot unnoticed.
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PHP formatting
        run: php vendor/bin/pint --test

      - run: npm ci

      - name: Check JS/CSS formatting
        run: npx prettier --check "resources/js/**/*.{js,jsx,css}"

      # Catches references to things that do not exist and hooks called
      # conditionally. Products/Show.jsx once rendered <ProductImage> without
      # importing it: the build succeeded, and every product detail page threw
      # at render and showed a blank screen. No PHP test can see that.
      - name: Lint JavaScript
        run: npm run lint

      # Every card, button, input, select and dropdown is meant to be rounded
      # 8px. A literal typed into any of the twenty-five stylesheets renders
      # slightly off and is only ever caught by eye — 6px, 10px and 9999px all
      # got in that way.
      - name: Check corner rounding
        run: npm run lint:radius

      # The shop has two themes, and only the semantic tokens flip between
      # them. A rule that names a palette colour directly keeps its light
      # value in the dark theme, and the failure is silent — near-black text
      # on a near-black card, on whichever page nobody happened to open.
      - name: Check theme tokens
        run: npm run lint:theme

      # React component and hook behaviour. The admin search box once fired an
      # unbounded request loop — 280 requests in 6 seconds — which was likewise
      # invisible to the PHP suite.
      - name: Frontend tests
        run: npm test

      - name: Build production assets
        run: npm run build

      # A test file co-located under Pages was picked up by the Inertia page
      # glob and bundled — Vitest and Testing Library included — as the
      # largest asset on the site. Nothing else would have noticed.
      - name: No test code in the production bundle
        run: |
          if ls public/build/assets/ | grep -Ei '\.(test|spec)-'; then
            echo "Test files were bundled into the production build."
            exit 1
          fi
          echo "No test code in the bundle."

